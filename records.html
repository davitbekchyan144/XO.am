<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>XO.am - Records</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Nav Bar -->
    <nav class="nav-bar">
      <div class="nav-logo">XO.am</div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Arena</a>
        <a href="records.html" class="nav-link active">Records</a>
        <a href="settings.html" class="nav-link">Settings</a>
        <a href="login.html" class="nav-link" data-auth-logout>Logout</a>
      </div>
    </nav>

    <!-- Main Records Content -->
    <main class="records-container">
      <!-- Profile Spotlight -->
      <div class="profile-spotlight">
        <h2 id="recordsPlayerName">Player Records</h2>
        <div class="record-grid">
          <div class="record-item">
            <span class="record-label">Wins</span>
            <span class="record-value" id="recordsWins">0</span>
          </div>
          <div class="record-item">
            <span class="record-label">Losses</span>
            <span class="record-value" id="recordsLosses">0</span>
          </div>
          <div class="record-item">
            <span class="record-label">Draws</span>
            <span class="record-value" id="recordsDraws">0</span>
          </div>
          <div class="record-item">
            <span class="record-label">Points</span>
            <span class="record-value" id="recordsPoints">0</span>
          </div>
        </div>
      </div>

      <!-- Rank Display -->
      <div class="rank-section">
        <h3>Current Rank</h3>
        <div class="rank-badge" id="rankBadge">Novice Challenger</div>
      </div>

      <!-- Match History Table -->
      <div class="match-history">
        <h3>Recent Matches</h3>
        <div class="matches-table">
          <div class="table-header">
            <div class="table-col">Opponent</div>
            <div class="table-col">Result</div>
            <div class="table-col">Date</div>
          </div>
          <div id="matchesTableBody"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="auth.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const playerName = localStorage.getItem('username') || 'Player';
      document.getElementById('recordsPlayerName').textContent = playerName + "'s Records";

      const wins = localStorage.getItem('wins') || '0';
      const losses = localStorage.getItem('losses') || '0';
      const draws = localStorage.getItem('draws') || '0';
      const points = localStorage.getItem('points') || '0';

      document.getElementById('recordsWins').textContent = wins;
      document.getElementById('recordsLosses').textContent = losses;
      document.getElementById('recordsDraws').textContent = draws;
      document.getElementById('recordsPoints').textContent = points;

      // Calculate rank
      const totalMatches = parseInt(wins) + parseInt(losses) + parseInt(draws);
      let rank = 'Novice Challenger';
      if (totalMatches >= 10 && (parseInt(wins) > parseInt(losses))) rank = 'Rising Star';
      if (totalMatches >= 20 && (parseInt(wins) > parseInt(losses) * 2)) rank = 'Arena Legend';
      document.getElementById('rankBadge').textContent = rank;

      // Load match history from localStorage
      const matchHistory = JSON.parse(localStorage.getItem('matchHistory') || '[]');
      const tbody = document.getElementById('matchesTableBody');

      if (matchHistory.length === 0) {
        tbody.innerHTML = '<div class="table-row"><div class="table-col">No matches yet</div></div>';
      } else {
        matchHistory.forEach(match => {
          const row = document.createElement('div');
          row.className = 'table-row';
          row.innerHTML = `
            <div class="table-col">${match.opponent}</div>
            <div class="table-col match-result-${match.result.toLowerCase()}">${match.result}</div>
            <div class="table-col">${match.date}</div>
          `;
          tbody.appendChild(row);
        });
      }
    });
  </script>
</body>
</html>
