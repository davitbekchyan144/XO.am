<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>XO.am - Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Nav Bar -->
    <nav class="nav-bar">
      <div class="nav-logo">XO.am</div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Arena</a>
        <a href="records.html" class="nav-link">Records</a>
        <a href="settings.html" class="nav-link active">Settings</a>
        <a href="login.html" class="nav-link" data-auth-logout>Logout</a>
      </div>
    </nav>

    <!-- Settings Content -->
    <main class="settings-container">
      <div class="settings-panel">
        <h2>Player Settings</h2>

        <div class="settings-group">
          <h3>Audio & Motion</h3>
          <div class="toggle-item">
            <label for="soundToggle">Sound Effects</label>
            <input type="checkbox" id="soundToggle" checked>
          </div>
          <div class="toggle-item">
            <label for="animToggle">Animations</label>
            <input type="checkbox" id="animToggle" checked>
          </div>
        </div>

        <div class="settings-group">
          <h3>Display Preferences</h3>
          <div class="toggle-item">
            <label for="darkToggle">Dark Mode</label>
            <input type="checkbox" id="darkToggle" checked>
          </div>
          <div class="toggle-item">
            <label for="notifyToggle">Notifications</label>
            <input type="checkbox" id="notifyToggle" checked>
          </div>
        </div>

        <div class="settings-group">
          <h3>Gameplay</h3>
          <div class="toggle-item">
            <label for="aiToggle">AI Difficulty Memory</label>
            <input type="checkbox" id="aiToggle" checked>
          </div>
          <div class="toggle-item">
            <label for="autoToggle">Auto-rematch</label>
            <input type="checkbox" id="autoToggle">
          </div>
        </div>

        <button class="btn-primary" onclick="saveSettings()">Save Settings</button>
        <p id="settingsSaveMessage" class="settings-save-message" role="status" aria-live="polite"></p>
      </div>

      <!-- Preview Card -->
      <div class="preview-card">
        <h3>Preview</h3>
        <div class="preview-content">
          <div class="opponent-card">
            <div class="opponent-avatar"></div>
            <div class="opponent-name">David</div>
            <div class="opponent-rank">Rank: Legendary</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="auth.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Load settings from localStorage
      document.getElementById('soundToggle').checked = localStorage.getItem('soundEnabled') !== 'false';
      document.getElementById('animToggle').checked = localStorage.getItem('animEnabled') !== 'false';
      document.getElementById('darkToggle').checked = localStorage.getItem('darkMode') !== 'false';
      document.getElementById('notifyToggle').checked = localStorage.getItem('notifyEnabled') !== 'false';
      document.getElementById('aiToggle').checked = localStorage.getItem('aiMemory') !== 'false';
      document.getElementById('autoToggle').checked = localStorage.getItem('autoRematch') === 'true';
    });

    function showSettingsMessage(message, isSuccess = true) {
      const messageElement = document.getElementById('settingsSaveMessage');
      if (!messageElement) return;

      messageElement.textContent = message;
      messageElement.classList.toggle('success', isSuccess);
      messageElement.classList.toggle('error', !isSuccess);
    }

    function saveSettings() {
      localStorage.setItem('soundEnabled', document.getElementById('soundToggle').checked);
      localStorage.setItem('animEnabled', document.getElementById('animToggle').checked);
      localStorage.setItem('darkMode', document.getElementById('darkToggle').checked);
      localStorage.setItem('notifyEnabled', document.getElementById('notifyToggle').checked);
      localStorage.setItem('aiMemory', document.getElementById('aiToggle').checked);
      localStorage.setItem('autoRematch', document.getElementById('autoToggle').checked);
      showSettingsMessage('Settings saved. Your preferences are ready.', true);
    }
  </script>
</body>
</html>
